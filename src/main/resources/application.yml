spring:
  application:
    name: fire-management-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: FireManagementHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none # Managed by Flyway database migrations
    open-in-view: false # Prevent N+1 select queries and db connection holding issues
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
        show_sql: false
        format_sql: false
        use_sql_comments: false
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-on-validation-error: false # Do not destroy production data on failure
    schemas: ${DB_SCHEMA:public}
    create-schemas: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8080}
          # jwk-set-uri can be explicitly set if public key endpoint is required directly
          jwk-set-uri: ${JWT_JWK_SET_URI:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  shutdown: graceful # Graceful shutdown capability for production/containers
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true # Enable liveness and readiness probes
  metrics:
    tags:
      application: ${spring.application.name}

# Custom configurations
app:
  security:
    jwt:
      secret: ${JWT_SECRET:84a43f112a1f496b8015cbf65e23631f4e1f72d4cf6741aa2d1f73b88a1b55a8} # Expiration/validation fallback secret
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} [TraceId: %X{correlationId:-none}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} [TraceId: %X{correlationId:-none}] - %msg%n"

