name: Java CI/CD Build and Test

on:
  push:
    branches: [ main, master, 'FIRE-*', 'feature/*', 'fix/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Maven Style Verification
      run: mvn checkstyle:check

    - name: Build and Verify with Maven
      run: mvn clean verify
      env:
        SPRING_PROFILES_ACTIVE: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: fire_management_test
        DB_USERNAME: test
        DB_PASSWORD: test
        DB_SCHEMA: fire_master_system
        JWT_ISSUER: http://localhost:8080
        JWT_SECRET: 84a43f112a1f496b8015cbf65e23631f4e1f72d4cf6741aa2d1f73b88a1b55a8
        JWT_EXPIRATION_MS: 86400000
        CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000

