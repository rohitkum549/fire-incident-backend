name: Java CI/CD Build and Test

on:
  push:
    branches: [ main, master, '001-backend-foundation' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Although Testcontainers spins up database containers dynamically,
      # docker-compose is available on the runner to support integration checks.
      docker:
        image: docker:dind
        options: --privileged

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Maven Style Verification
      run: mvn checkstyle:check

    - name: Build and Verify with Maven
      run: mvn clean verify
      env:
        # Prevent Flyway or tests from trying to connect to production Supabase
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: test
        DB_USERNAME: test
        DB_PASSWORD: test
        JWT_SECRET: 84a43f112a1f496b8015cbf65e23631f4e1f72d4cf6741aa2d1f73b88a1b55a8
        CORS_ALLOWED_ORIGINS: http://localhost:3000
